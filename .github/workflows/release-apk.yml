name: Release APK build and perf budget

# 제출 전 확인용: release APK 두 개를 빌드하고 크기·성능 예산 테스트 결과를 남긴다.
# 공식 제출 업로드(Release·apk/ 커밋)는 하지 않는다 — 산출물은 Actions artifact(14일)로만.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**', 'chore/release-apk']

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Perf budget test + release builds
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testMockDebugUnitTest --tests '*PerfBudgetTest' :app:assembleMockRelease :app:assembleVehicleRelease
      - name: Screenshots at car-window sizes (Robolectric + Roborazzi)
        id: shots
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testMockDebugUnitTest --tests '*Screenshot*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            app/build/outputs/roborazzi/*.png
            app/build/reports/tests/testMockDebugUnitTest/
          retention-days: 14
      - name: Android lint (결과만 모은다 — 오류가 있어도 다음 단계로)
        run: ./gradlew --no-daemon :app:lintMockDebug :app:lintVehicleDebug || true
      - name: Report
        run: |
          grep -h "PERF" app/build/test-results/testMockDebugUnitTest/*.xml || true
          # Android lint 요약: 오류 수·경고 수·오류 내용
          for f in app/build/reports/lint-results-*.xml; do echo "== $f"; grep -c 'severity="Error"' "$f" || true; grep -c 'severity="Warning"' "$f" || true; grep -B1 -A3 'severity="Error"' "$f" | grep -E 'id=|message=|file=' | head -60 || true; done
          ls -l app/build/outputs/apk/*/release/*.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/35.0.0/aapt2)
          for f in app/build/outputs/apk/*/release/*.apk; do echo "== $f"; "$AAPT" dump permissions "$f" || true; "$AAPT" dump badging "$f" | grep -E "^package|sdkVersion|targetSdk" || true; done
      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            app/build/outputs/apk/*/release/*.apk
            app/build/reports/lint-results-*.html
          retention-days: 14
