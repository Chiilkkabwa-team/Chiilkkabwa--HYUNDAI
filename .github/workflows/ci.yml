name: Team CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'docs/**'
      - 'chore/**'
      - 'integration/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-unit:
    name: Web unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test web logic
        run: node --test web/test/*.test.mjs

  android-check:
    name: Android tests and both debug flavors
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android components
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests and compile both flavors
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testMockDebugUnitTest :app:assembleMockDebug :app:assembleVehicleDebug

# CI is not an emulator or real-car integration test.
# Pleos Maven access failures must be reported as blocked, not as passing results.
