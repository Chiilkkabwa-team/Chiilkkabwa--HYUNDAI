name: Team CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'fix/**'
      - 'docs/**'
      - 'chore/**'
      - 'integration/**'
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-unit:
    name: Web unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test web logic
        run: node --test web/test/*.test.mjs

  android-check:
    name: Android tests and both debug flavors
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble A-part verification APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testMockDebugUnitTest :app:assembleMockDebug :app:assembleVehicleDebug -PenablePleosSignals=true -PenableAaosSpeed=true
      - name: Attach the Pleos vehicle debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chiilkkabwa-2a70830-pleos-vehicle-debug
          path: app/build/outputs/apk/vehicle/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Attach the Android Mock debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chiilkkabwa-2a70830-mock-debug
          path: app/build/outputs/apk/mock/debug/*.apk
          if-no-files-found: error
          retention-days: 7

# Normal feature PRs target dev. The main target is reserved for an explicitly approved dev -> main release PR.
# CI is not a branch-protection rule; it reports failures but cannot prevent unauthorized direct pushes.
# CI is not an emulator or real-car integration test.
# Pleos Maven access failures must be reported as blocked, not as passing results.
